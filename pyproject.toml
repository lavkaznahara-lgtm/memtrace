
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace"
version = "0.1.0"
description = "Independent memory auditing layer for AI agents (Day 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["memtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["memtrace", "tests", "examples"]